name: Suggest an edit to a station
description: Correct something wrong or add something missing about one lighthouse, lightship or life-saving station.
title: "Edit: "
labels: ["edit"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Usually this form is opened from **Suggest an edit** on a station's page, which fills in the first four boxes for you.
        Tell us what is wrong, what is right, and how you know. Short is fine.
        This issue is public, so please do not include private details such as your phone number or home address.
  - type: input
    id: station_id
    attributes:
      label: Station id
      description: The id on the station's page, like us-me-portland-head or ca-ns-sambro-island. Leave empty if the station is missing from Fresnel.
      placeholder: us-me-portland-head
    validations:
      required: false
  - type: input
    id: station_name
    attributes:
      label: Station name
      placeholder: Portland Head Light
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (state, territory or province, and country)
      description: Filled in from the station's page. For a station missing from Fresnel, say where it is.
      placeholder: Maine, United States / Puerto Rico, United States / Nova Scotia, Canada
    validations:
      required: false
  - type: input
    id: page_url
    attributes:
      label: Fresnel page
      placeholder: https://holdthedoorhoid.github.io/fresnel/s/us-me-portland-head/
    validations:
      required: false
  - type: dropdown
    id: topic
    attributes:
      label: What is it about?
      multiple: true
      options:
        - Location on the map
        - Status (active, light out, lost, ruins, moved, replica)
        - Visiting or access (private, closed, boat only, keepers living there)
        - Climbing the tower or staying overnight
        - The light (pattern, height, range, lens, fog signal)
        - Structures, dates or the timeline
        - The history or the keepers
        - Photos
        - This station is missing from Fresnel
        - Something else
    validations:
      required: true
  - type: textarea
    id: whats_wrong
    attributes:
      label: What is wrong or missing?
      placeholder: The page says the light was put out in 1975, but it is still an active aid to navigation.
    validations:
      required: true
  - type: textarea
    id: correct_info
    attributes:
      label: What is the correct information?
      placeholder: It still shows a white flash every 4 seconds; the Coast Guard maintains it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How do you know? (source or evidence)
      description: A link, a book or report, the Light List, a register entry, or your own visit with its date. This helps us check and credit it.
      placeholder: Visited on 14 July 2026. USCG Light List, volume I, number ...
    validations:
      required: false
  - type: dropdown
    id: photo_offer
    attributes:
      label: Do you have photos you could share?
      options:
        - "No"
        - Yes, I took them and I am happy to share them under CC BY-SA 4.0 with credit
        - Yes, but someone else took them (we will ask them)
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: How should we credit you? (optional)
      description: Leave empty to stay anonymous.
    validations:
      required: false
